version = 1
project_agents = []

[[agents]]
id = "bb-pm"
display_name = "BB PM"
kind = "opencode_agent"
runtime = "opencode"
scope = "global"
status = "active"
assignable = true
distribute = true
source_path = "<bb-root>/agents/opencode/bb-pm.md"
roles = [
    "pm",
    "inbox-triage",
    "ticket-maintenance",
]
description = "Blackboard PM agent: condenses inbox notes into existing tickets and keeps handoffs slim."
model = "minimax-cn/MiniMax-M2.7-highspeed"
instructions_path = "agents/prompts/task-graph-inbox-cleanup.md"
max_concurrent_tasks = 3

[agents.custom_env]
BB_DAEMON = "1"
BB_DAEMON_AGENT = "bb-pm"

[[agents.mcp_servers]]
name = "bb"
transport = "stdio"
command = "bb"
args = [
    "--root",
    "<bb-root>",
    "stdio",
]

[[agents.mcp_servers]]
name = "qmd"
transport = "stdio"
command = "qmd"
args = ["serve"]

