version = 2
project_agents = []

[[runtimes]]
id = "codebuddy"
display_name = "CodeBuddy"
assignable = true
roles = ["engineering"]
description = "CodeBuddy runtime for codebase work."

[[runtimes]]
id = "codex"
display_name = "Codex"
assignable = true
command = "codex"
roles = [
    "generalist",
    "engineering",
]
description = "Codex runtime for implementation, debugging, and multimodal product work."

[[runtimes]]
id = "opencode"
display_name = "OpenCode"
assignable = true
command = "opencode"
roles = [
    "engineering",
    "research",
]
description = "OpenCode runtime for backend work, research workflows, and automated pipelines."

[[runtimes]]
id = "pi"
display_name = "Pi"
assignable = true
command = "pi"
roles = [
    "engineering",
    "research",
]
description = "Pi runtime for lightweight terminal coding workflows."

[[agents]]
id = "bb-pm"
display_name = "BB PM"
runtime = "opencode"
scope = "global"
status = "active"
assignable = true
distribute = true
source_path = "<bb-root>/agents/opencode/bb-pm.md"
roles = [
    "pm",
    "inbox-triage",
    "ticket-maintenance",
]
description = "Blackboard PM agent: condenses inbox notes into existing tickets and keeps handoffs slim."
model = "minimax-cn/MiniMax-M2.7-highspeed"
instructions_path = "agents/prompts/task-graph-inbox-cleanup.md"
max_concurrent_tasks = 3

[agents.custom_env]
BB_DAEMON = "1"
BB_DAEMON_AGENT = "bb-pm"

[[agents.mcp_servers]]
name = "bb"
transport = "stdio"
command = "bb"
args = [
    "--root",
    "<bb-root>",
    "stdio",
]

[[agents.mcp_servers]]
name = "qmd"
transport = "stdio"
command = "qmd"
args = ["serve"]

[[agents]]
id = "owner"
display_name = "Project Owner"
scope = "global"
status = "active"
assignable = true
distribute = false
roles = ["owner"]
description = "Blackboard owner and product decision maker."

